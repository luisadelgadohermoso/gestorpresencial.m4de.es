  <title>Panel Directivo M4DE</title>

    /* Fuerza a que el software de Google ocupe el 100% de la pantalla del móvil */

    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <!-- Inyección maestra estable del software administrativo M4DE -->
